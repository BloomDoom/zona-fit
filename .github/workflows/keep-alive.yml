# Supabase pauses free projects after 7 days with no activity (e.g. during
# the January holidays). This calls the database every 3 days so it stays awake.
name: Keep Supabase awake

on:
  schedule:
    - cron: '0 12 */3 * *' # 12:00 UTC (09:00 in Argentina), every 3 days
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl --fail -sS -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_KEY }}
